      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: pages/research.qmd
      - text: "Teaching"
        href: pages/teaching.qmd
      - text: "About Me"
        href: pages/about.qmd
    right:
      - icon: envelope
        href: mailto:jadamson@tru.ca
        aria-label: Email
      - icon: mortarboard-fill
